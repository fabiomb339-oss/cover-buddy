<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cover Buddy</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#14110f">
<style>
:root{--bg:#14110f;--panel:#201b17;--line:#3a322b;--tx:#f5ede3;--mut:#a39786;--ac:#ffb020;--me:#3b2f1f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:var(--tx)}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
button{background:var(--ac);color:#1a1208;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
button.g{background:var(--panel);color:var(--tx);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#login{margin:auto;width:min(380px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:10px}
#login h1{margin:0 0 4px;font-size:26px}
#err{color:#ff8a7a;min-height:1.2em;font-size:14px}
#app{display:none;flex:1;min-height:0;flex-direction:column;width:min(900px,100%);margin:0 auto}
header{display:flex;gap:8px;padding:10px;align-items:center;border-bottom:1px solid var(--line)}
header select{flex:1;min-width:0}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--me)}
.b{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.m img{max-width:100%;border-radius:10px;display:block;margin-top:8px}
.row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.row button,.row a{font-size:14px;padding:6px 10px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;text-decoration:none}
#bar{padding:10px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) 10px;border-top:1px solid var(--line)}
#pv{display:flex;gap:6px;flex-wrap:wrap}
#pv img{height:54px;border-radius:8px}
#in{display:flex;gap:6px;align-items:flex-end;margin-top:6px}
#t{flex:1;resize:none;max-height:140px}
</style>
</head>
<body>

<form id="login" onsubmit="return false">
  <h1>Cover Buddy</h1>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password (min. 6 caratteri)" autocomplete="current-password">
  <button id="bin">Accedi</button>
  <button id="breg" class="g">Registrati</button>
  <button id="bgo" class="g">Continua con Google</button>
  <div id="err" role="alert"></div>
</form>

<div id="app">
  <header>
    <select id="sel" aria-label="Chat"></select>
    <button id="new" class="g">Nuova chat</button>
    <button id="out" class="g">Esci</button>
  </header>
  <div id="msgs"></div>
  <div id="bar">
    <div id="pv"></div>
    <div id="in">
      <button id="att" class="g" title="Allega foto" aria-label="Allega foto">📎</button>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <textarea id="t" rows="1" placeholder="Scrivi o parla…"></textarea>
      <button id="mic" class="g" title="Parla" aria-label="Microfono">🎤</button>
      <button id="go">Invia</button>
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== DA COMPILARE ====== */
const FIREBASE = { apiKey:"AIzaSyCbMlfWvmOeAvb-eBO4DYFNPaqxktveYZA", authDomain:"copertai.firebaseapp.com", projectId:"copertai", appId:"1:212345181662:web:204242d042c7f1f76e394f" };
const WORKER = "https://cover-buddy.fabiomb339.workers.dev";
/* ========================== */

const app = initializeApp(FIREBASE), auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
let user, style = "", chats = [], cur, pending = [], voice = false;

// ---------- Login ----------
const showErr = e => $("err").textContent = e.code ? e.code.replace("auth/","").replace(/-/g," ") : e.message;
$("bin").onclick = () => signInWithEmailAndPassword(auth,$("em").value,$("pw").value).catch(showErr);
$("breg").onclick = () => createUserWithEmailAndPassword(auth,$("em").value,$("pw").value).catch(showErr);
$("bgo").onclick = () => signInWithPopup(auth,new GoogleAuthProvider()).catch(showErr);
$("out").onclick = () => signOut(auth);

onAuthStateChanged(auth, async u => {
  user = u;
  $("login").style.display = u ? "none" : "grid";
  $("app").style.display = u ? "flex" : "none";
  if (!u) return;
  try { const s = await getDoc(doc(db,"users",u.uid)); style = s.exists() ? (s.data().style||"") : ""; } catch(e){}
  chats = JSON.parse(localStorage.getItem("chats_"+u.uid) || "[]");
  if (!chats.length) newChat(); else { cur = chats[0]; draw(); }
});

// ---------- Chat salvate (solo testo, sul dispositivo) ----------
function save(){
  const slim = chats.map(c => ({...c, msgs:c.msgs.map(m => ({role:m.role,text:m.text}))}));
  try { localStorage.setItem("chats_"+user.uid, JSON.stringify(slim)); } catch(e){}
}
function newChat(){ cur = {id:Date.now(),title:"Nuova chat",msgs:[]}; chats.unshift(cur); save(); draw(); }
$("new").onclick = newChat;
$("sel").onchange = e => { cur = chats.find(c => c.id == e.target.value); draw(); };

// ---------- Disegno interfaccia ----------
function draw(){
  $("sel").innerHTML = chats.map(c => `<option value="${c.id}" ${c===cur?"selected":""}>${esc(c.title)}</option>`).join("");
  const box = $("msgs"); box.innerHTML = "";
  if (!cur.msgs.length) add({role:"model",text: style
    ? "Ehi! Dimmi il video e ti preparo la copertina 😎"
    : "Ehi, benvenuto! Sono il tuo amico delle copertine YouTube. Chiedimi la prima copertina e prima ti faccio due domande sul tuo stile 😎"}, true);
  cur.msgs.forEach(m => add(m, true));
  box.scrollTop = box.scrollHeight;
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function add(m){
  const d = document.createElement("div");
  d.className = "m " + (m.role==="user" ? "u" : "b");
  d.textContent = m.text || "";
  (m.imgs||[]).forEach((src,i) => {
    const im = new Image(); im.src = src; d.appendChild(im);
    if (m.role==="model"){
      const r = document.createElement("div"); r.className = "row";
      r.innerHTML = `<a href="${src}" download="copertina-${Date.now()}.png">⬇ Scarica</a>`;
      const b = document.createElement("button"); b.textContent = "📋 Copia";
      b.onclick = async () => { try {
        const bl = await (await fetch(src)).blob();
        await navigator.clipboard.write([new ClipboardItem({[bl.type]:bl})]); b.textContent = "✔ Copiata";
      } catch(e){ b.textContent = "Copia non supportata: usa Scarica"; } };
      r.appendChild(b); d.appendChild(r);
    }
  });
  $("msgs").appendChild(d); $("msgs").scrollTop = $("msgs").scrollHeight;
  return d;
}

// ---------- Allegati ----------
$("att").onclick = () => $("file").click();
$("file").onchange = async e => {
  for (const f of e.target.files) pending.push(await shrink(f));
  e.target.value = ""; preview();
};
const preview = () => { $("pv").innerHTML = ""; pending.forEach(s => { const i = new Image(); i.src = s; $("pv").appendChild(i); }); };
function shrink(f){ return new Promise(ok => {
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 1280/Math.max(im.width,im.height)), c = document.createElement("canvas");
    c.width = im.width*k; c.height = im.height*k; c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    ok(c.toDataURL("image/jpeg",.88)); }; im.src = r.result; };
  r.readAsDataURL(f); }); }
const part = s => ({inlineData:{mimeType:s.slice(5,s.indexOf(";")),data:s.split(",")[1]}});

// ---------- Cervello ----------
const sys = () => `Sei "Cover Buddy", un amico simpatico e scherzoso, esperto di copertine (thumbnail) per video YouTube. Rispondi in modo breve e veloce.
TONO: copia il registro dell'utente. Se è informale, sii informale. Se è arrabbiato o usa parolacce, rispondi anche tu arrabbiato-scherzoso con qualche parolaccia leggera, senza esagerare e senza offendere nessuno sul serio. Se è serio, sii più serio. Rispondi nella sua lingua.
COPERTINE: quando l'utente vuole una copertina, scrivi una riga amichevole e poi, su una riga a parte, [[IMG: prompt in inglese]]. Il generatore di immagini parte SOLO dal testo e non può usare le foto allegate né riprodurre volti: quindi descrivi sfondo, oggetti, colori, luci ed emozione, tieni il soggetto principale nella fascia centrale, lascia uno spazio libero a sinistra o a destra dove l'utente aggiungerà la propria faccia, e usa al massimo 3 parole di testo grande e leggibile. Il prompt deve essere descrittivo (almeno 40 parole), in formato 16:9 per YouTube, e rispettare lo stile salvato. Mai più di una immagine per volta.
${style
 ? `STILE SALVATO (rispettalo sempre, NON rifare domande sullo stile): ${style}\nSolo se l'utente chiede esplicitamente di cambiare stile, fai le domande necessarie e salva il nuovo stile.`
 : `NESSUNO STILE SALVATO: alla prima richiesta di copertina NON generare subito. Chiedi che stile vuole e fatti spiegare tutto in modo super dettagliato (colori, font, testi, espressioni del viso, sfondo, mood, canali di esempio, ecc.). Se ha dubbi o domande, rispondi con pazienza e dagli esempi. Quando hai tutto, riassumi lo stile e chiedi conferma.`}
SALVATAGGIO: quando lo stile è confermato o cambiato, scrivi su una riga a parte [[STYLE: riassunto completo e dettagliatissimo dello stile]]. Se l'utente aveva già chiesto una copertina, aggiungi subito dopo [[IMG: ...]].`;

async function call(kind,payload){
  const r = await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({idToken:await user.getIdToken(),kind,payload})});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error?.message || "Errore "+r.status);
  return j;
}

async function submit(text){
  text = (text||"").trim(); if (!text && !pending.length) return;
  const imgs = pending; pending = []; preview(); $("t").value = "";
  cur.msgs.push({role:"user",text,imgs}); if (cur.title==="Nuova chat") cur.title = (text||"Foto").slice(0,28);
  if (cur.msgs.length===1) $("msgs").innerHTML = "";
  add(cur.msgs.at(-1));
  const wait = add({role:"model",text:"…"});
  try {
    const last = cur.msgs.length-1;
    const contents = cur.msgs.map((m,i) => ({role:m.role,parts:[{text:m.text||"(foto)"},
      ...(m.role==="user" && i>=last-3 ? (m.imgs||[]).map(part) : [])]}));
    const j = await call("chat",{systemInstruction:{parts:[{text:sys()}]},contents});
    let out = (j.candidates?.[0]?.content?.parts||[]).map(p => p.text||"").join("");
    const st = out.match(/\[\[STYLE:([\s\S]*?)\]\]/), im = out.match(/\[\[IMG:([\s\S]*?)\]\]/);
    out = out.replace(/\[\[(STYLE|IMG):[\s\S]*?\]\]/g,"").trim();
    if (st){ style = st[1].trim(); await setDoc(doc(db,"users",user.uid),{style},{merge:true}); }
    wait.remove();
    if (out){ cur.msgs.push({role:"model",text:out}); add(cur.msgs.at(-1)); if (voice) speak(out); }
    if (im) await makeImage(im[1].trim());
  } catch(e){ wait.remove(); add({role:"model",text:"Ops, errore: "+e.message}); }
  voice = false; save();
}

const crop169 = src => new Promise(ok => {
  const im = new Image();
  im.onload = () => {
    const w = im.width, h = Math.round(w*9/16);
    if (im.height <= h) return ok(src);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(im,0,(im.height-h)/2,w,h,0,0,w,h); ok(c.toDataURL("image/png"));
  };
  im.onerror = () => ok(src); im.src = src;
});

async function makeImage(prompt){
  const w = add({role:"model",text:"Sto disegnando la copertina… 🎨"});
  try {
    const full = `${prompt}\n\nStyle guidelines: ${style}`.slice(0,1900);
    const j = await call("image",{prompt:full});
    const raw = (j.candidates?.[0]?.content?.parts||[]).filter(p => p.inlineData)
      .map(p => `data:${p.inlineData.mimeType};base64,${p.inlineData.data}`);
    if (!raw.length) throw new Error("nessuna immagine ricevuta");
    const imgs = await Promise.all(raw.map(crop169));
    w.remove();
    cur.msgs.push({role:"model",text:"Ecco qua! Dimmi se vuoi ritocchi 🔥",imgs}); add(cur.msgs.at(-1));
  } catch(e){ w.remove(); add({role:"model",text:"Non sono riuscito a creare l'immagine: "+e.message}); }
}

// ---------- Voce ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$("mic").onclick = () => {
  if (!SR) return alert("Il microfono richiede Chrome, Edge o Safari aggiornati.");
  const r = new SR(); r.lang = "it-IT"; $("mic").textContent = "🔴";
  r.onresult = e => { voice = true; submit(e.results[0][0].transcript); };
  r.onend = () => $("mic").textContent = "🎤"; r.start();
};
function speak(t){ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "it-IT"; speechSynthesis.speak(u); }

$("go").onclick = () => submit($("t").value);
$("t").onkeydown = e => { if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submit($("t").value); } };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
